[package]
name = "relk"
version = "0.1.0"
edition = "2024"

# No dependencies: `relk.o` must stay libc-only; `c/rs.h` comes from the cbindgen CLI, not a build script.
[dependencies]

[lib]
path = "src/lib.rs"
# rlib for qrs, staticlib for `cargo build -p relk` alone (its `qlean_*` set is gate `relk-syms`)
crate-type = ["staticlib", "rlib"]
# doc tests would link the `no_std` panic handler into a `std` binary
doctest = false

[features]
# the `qlean_*` Lean externs (`ffi.rs`, `ffi/*.rs`); off for a crate that links beside the rel package's object, which defines them
default = ["ffi"]
ffi = []
# the lean.rs twins test/abi.c calls, built by `build.sh abi` into a separate object, never into relk.o
abi = []
# the lib as a `std` crate, for qrs's unit tests (a no_std lib cannot be built with the test profile's unwinding panics)
std = []

# A workspace of this crate alone; `rt/` is a package of its own (the Lean runtime of a native Rel program), with its
# own `[workspace]`.
[workspace]
exclude = ["rt"]
resolver = "3"

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
